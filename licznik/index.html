<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licznik odwiedzin | trawiasta.pl</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0c0a; --accent: #3dff7a; --accent2: #b8ff3d; --text: #e8f5e9; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow-x: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(61, 255, 122, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(184, 255, 61, 0.06) 0%, transparent 50%);
  }
  .container { text-align: center; z-index: 2; padding: 2rem; max-width: 760px; width: 100%; }
  .container.wide { max-width: 1120px; }
  .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
  .grass { width: 2rem; height: 2rem; filter: drop-shadow(0 0 8px rgba(61, 255, 122, 0.4)); }
  .brand {
    font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .status {
    display: inline-block; background: rgba(61, 255, 122, 0.1); border: 1px solid rgba(61, 255, 122, 0.3);
    color: var(--accent); padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.2rem;
  }
  .count {
    font-size: clamp(4.5rem, 20vw, 10rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.05;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 30px rgba(61, 255, 122, 0.25));
    min-height: 1.05em;
  }
  .count.loading { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .label { font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 300; opacity: 0.85; letter-spacing: 0.05em; margin: 0.6rem 0 2.5rem; }
  .error { color: #ffd27a; font-weight: 300; margin: 0.6rem 0 2.5rem; font-size: 1.1rem; }
  .btn {
    display: inline-block; text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0c0a;
    padding: 1rem 2.2rem; font-size: 1.05rem; font-weight: 600; border-radius: 999px;
    transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 30px rgba(61, 255, 122, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(61, 255, 122, 0.5); }
  .btn:active { transform: translateY(0); }
  .login-link {
    display: inline-block; margin-top: 1.4rem; font-size: 0.9rem; color: var(--accent);
    opacity: 0.75; text-decoration: none;
  }
  .login-link:hover, .login-link:focus-visible { opacity: 1; text-decoration: underline; }
  .visits { margin-top: 3rem; text-align: left; }
  .visits h2 {
    font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.3rem;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .visits .meta { font-size: 0.9rem; font-weight: 300; opacity: 0.7; margin-bottom: 1rem; }
  .visits .msg { font-weight: 300; opacity: 0.85; padding: 1.2rem 0; }
  .visits .msg.err { color: #ffd27a; }
  .table-wrap {
    border: 1px solid rgba(61, 255, 122, 0.18); border-radius: 1.1rem; overflow: hidden;
    background: rgba(255, 255, 255, 0.025); box-shadow: 0 0 50px rgba(61, 255, 122, 0.06);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th {
    text-align: left; font-weight: 500; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); background: rgba(61, 255, 122, 0.07); padding: 0.8rem 1rem; white-space: nowrap;
  }
  td { padding: 0.7rem 1rem; border-top: 1px solid rgba(61, 255, 122, 0.08); vertical-align: top; }
  tbody tr:hover td { background: rgba(61, 255, 122, 0.04); }
  td.nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; word-break: break-all; }
  .muted { opacity: 0.45; }
  .dev { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.8rem;
         background: rgba(61, 255, 122, 0.1); border: 1px solid rgba(61, 255, 122, 0.25); color: var(--accent); white-space: nowrap; }
  @media (max-width: 760px) {
    .container { padding: 1.5rem 1rem; }
    .table-wrap { border: none; background: none; box-shadow: none; overflow: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    tr {
      border: 1px solid rgba(61, 255, 122, 0.18); border-radius: 1rem; margin-bottom: 0.8rem;
      background: rgba(255, 255, 255, 0.03); padding: 0.4rem 0;
    }
    td { border: none; padding: 0.35rem 1rem; display: flex; gap: 0.8rem; justify-content: space-between; text-align: right; }
    td::before {
      content: attr(data-label); flex-shrink: 0; text-align: left; font-size: 0.72rem; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--accent); opacity: 0.8; padding-top: 0.15rem;
    }
    td.nowrap { white-space: normal; }
    tbody tr:hover td { background: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <svg class="grass" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 58V28" stroke="#3dff7a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M32 42C26 36 20 28 18 16" stroke="#3dff7a" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 42C38 36 44 28 46 16" stroke="#b8ff3d" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 36C28 32 24 26 22 18" stroke="#7dffb3" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 36C36 32 40 26 42 18" stroke="#d4ff4a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 48C29 44 25 40 22 34" stroke="#3dff7a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M32 48C35 44 39 40 42 34" stroke="#b8ff3d" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="brand">trawiasta.pl</div>
  </div>
  <div class="status">Licznik odwiedzin</div>
  <div class="count loading" id="count" aria-live="polite">…</div>
  <div class="label" id="label">łączna liczba odwiedzin strony głównej</div>
  <a class="btn" href="/">wróć na stronę główną</a>
  <div><a class="login-link" id="login-link" href="/logowanie/?next=/licznik/" hidden>Zaloguj się, aby zobaczyć szczegóły</a></div>

  <section class="visits" id="visits" hidden aria-labelledby="visits-title">
    <h2 id="visits-title">Ostatnie odwiedziny</h2>
    <p class="meta" id="visits-meta">Najnowsze na górze. Czas: Polska (Europe/Warsaw).</p>
    <div class="msg" id="visits-msg">Wczytywanie…</div>
    <div class="table-wrap" id="table-wrap" hidden>
      <table>
        <thead>
          <tr><th scope="col">Data i godzina</th><th scope="col">Adres IP</th><th scope="col">Lokalizacja</th><th scope="col">Urządzenie</th><th scope="col">Przeglądarka</th><th scope="col">System</th></tr>
        </thead>
        <tbody id="visits-body"></tbody>
      </table>
    </div>
  </section>
</div>
<script>
(function () {
  var el = document.getElementById('count');
  var label = document.getElementById('label');
  var fmt = new Intl.NumberFormat('pl-PL');

  function animateTo(target) {
    el.classList.remove('loading');
    var duration = Math.min(2000, 600 + target * 4);
    var start = null;
    function step(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt.format(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function fail() {
    el.classList.remove('loading');
    el.textContent = '🌱';
    label.className = 'error';
    label.textContent = 'Ups, nie udało się teraz pobrać licznika. Spróbuj odświeżyć stronę za chwilę.';
  }

  var loggedIn = false;
  try { loggedIn = sessionStorage.getItem('trawiasta_zalogowany') === '1'; } catch (e) {}
  if (loggedIn) {
    document.getElementById('visits').hidden = false;
    document.querySelector('.container').classList.add('wide');
  } else {
    document.getElementById('login-link').hidden = false;
  }

  // ---- tabela odwiedzin (tylko po zalogowaniu; to NIE jest prawdziwe zabezpieczenie) ----
  var KV = 'https://keyvalue.immanuel.co/api/KeyVal/GetValue/dqr9pmjx/v';
  var MAX_ROWS = 120;
  var msg = document.getElementById('visits-msg');
  var dtf = new Intl.DateTimeFormat('pl-PL', { timeZone: 'Europe/Warsaw', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var countries = null;
  try { countries = new Intl.DisplayNames(['pl'], { type: 'region' }); } catch (e) {}
  var DEV = { p: 'telefon', t: 'tablet', k: 'komputer', b: 'bot' };

  function visitsError() {
    msg.className = 'msg err';
    msg.textContent = 'Nie udało się teraz pobrać listy odwiedzin. Spróbuj odświeżyć stronę za chwilę.';
  }
  function decode(txt) {
    if (typeof txt !== 'string' || !txt) return null;
    try {
      var b = txt.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var row = JSON.parse(new TextDecoder().decode(bytes));
      return Array.isArray(row) && typeof row[0] === 'number' ? row : null;
    } catch (e) { return null; }
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // serwer odrzuca zbyt wiele równoległych zapytań (503), więc ponawiamy z opóźnieniem
  function fetchRow(n, attempt) {
    attempt = attempt || 0;
    return fetch(KV + n, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (t) { var row = decode(t); if (row) row.n = n; return row; })
      .catch(function () {
        if (attempt >= 3) return undefined;
        return wait(300 * (attempt + 1) + Math.random() * 300).then(function () { return fetchRow(n, attempt + 1); });
      });
  }
  function cell(tr, label, text, cls) {
    var td = document.createElement('td');
    td.setAttribute('data-label', label);
    if (cls) td.className = cls;
    if (text) td.textContent = text; else { var s = document.createElement('span'); s.className = 'muted'; s.textContent = '—'; td.appendChild(s); }
    tr.appendChild(td);
    return td;
  }
  function render(rows) {
    var tbody = document.getElementById('visits-body');
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      cell(tr, 'Data i godzina', dtf.format(new Date(r[0] * 1000)), 'nowrap');
      cell(tr, 'Adres IP', String(r[1] || ''), 'ip');
      var cc = String(r[4] || '').toUpperCase(), country = cc;
      try { if (countries && /^[A-Z]{2}$/.test(cc)) country = countries.of(cc); } catch (e) {}
      var loc = [r[2], r[3], country].map(function (x) { return String(x || '').trim(); })
        .filter(function (x, i, a) { return x && a.indexOf(x) === i; }).join(', ');
      cell(tr, 'Lokalizacja', loc);
      var td = cell(tr, 'Urządzenie', '');
      td.textContent = '';
      var badge = document.createElement('span'); badge.className = 'dev';
      badge.textContent = DEV[r[5]] || 'nieznane'; td.appendChild(badge);
      cell(tr, 'Przeglądarka', String(r[6] || ''));
      cell(tr, 'System', String(r[7] || ''));
      tbody.appendChild(tr);
    });
  }
  function loadVisits(total) {
    var ids = [];
    for (var n = total; n >= 1 && ids.length < MAX_ROWS; n--) ids.push(n);
    if (!ids.length) { msg.textContent = 'Nie ma jeszcze żadnych zapisanych odwiedzin.'; return; }
    var results = new Array(ids.length), next = 0, failed = 0, done = 0;
    function worker() {
      if (next >= ids.length) return Promise.resolve();
      var i = next++;
      return fetchRow(ids[i]).then(function (row) {
        if (row === undefined) failed++;
        results[i] = row; done++;
        msg.textContent = 'Wczytywanie… ' + done + ' / ' + ids.length;
        return worker();
      });
    }
    var pool = [];
    for (var k = 0; k < 3; k++) pool.push(worker());
    Promise.all(pool).then(function () {
      var rows = results.filter(Boolean).sort(function (a, b) { return b[0] - a[0] || b.n - a.n; });
      if (!rows.length) {
        if (failed > 0) visitsError();
        else msg.textContent = 'Nie ma jeszcze żadnych zapisanych odwiedzin.';
        return;
      }
      msg.hidden = true;
      document.getElementById('table-wrap').hidden = false;
      document.getElementById('visits-meta').textContent =
        'Liczba wpisów: ' + rows.length + ' (najnowsze na górze, maks. ' + MAX_ROWS + '). Czas: Polska (Europe/Warsaw).';
      render(rows);
    });
  }

  // tylko odczyt – ta strona NIE zwiększa licznika
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
  fetch('https://abacus.jasoncameron.dev/get/trawiasta-pl/odwiedziny', { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) {
      if (r.status === 404) return { value: 0 };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      clearTimeout(timer);
      var v = Number(d && d.value);
      if (!isFinite(v) || v < 0) throw new Error('bad value');
      animateTo(v);
      if (loggedIn) loadVisits(v);
    })
    .catch(function () { clearTimeout(timer); fail(); if (loggedIn) visitsError(); });
})();
</script>
</body>
</html>
