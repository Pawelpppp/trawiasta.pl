<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – Ups, tu nic nie wyrosło | trawiasta.pl</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0a;
    --accent: #3dff7a;
    --accent2: #b8ff3d;
    --text: #e8f5e9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(61, 255, 122, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(184, 255, 61, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .container { text-align: center; z-index: 2; padding: 2rem; max-width: 700px; }
  .grass {
    width: 4rem;
    height: 4rem;
    filter: drop-shadow(0 0 10px rgba(61, 255, 122, 0.4));
    transform-origin: 50% 90%;
    animation: sway 3.5s ease-in-out infinite;
  }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .code {
    font-size: clamp(5rem, 22vw, 10rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0.5rem 0 1rem;
  }
  h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 500;
    margin-bottom: 0.8rem;
  }
  p {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 300;
    opacity: 0.8;
    margin-bottom: 2.5rem;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0c0a;
    padding: 1rem 2.2rem;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 999px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px rgba(61, 255, 122, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(61, 255, 122, 0.5); }
  .btn:active { transform: translateY(0); }
  .footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.4;
    z-index: 2;
  }
  .footer a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <svg class="grass" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M32 58V28" stroke="#3dff7a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 42C26 36 20 28 18 16" stroke="#3dff7a" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 42C38 36 44 28 46 16" stroke="#b8ff3d" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 36C28 32 24 26 22 18" stroke="#7dffb3" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 36C36 32 40 26 42 18" stroke="#d4ff4a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 48C29 44 25 40 22 34" stroke="#3dff7a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 48C35 44 39 40 42 34" stroke="#b8ff3d" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <div class="code">404</div>
  <h1>Ups, tu nic nie wyrosło</h1>
  <p>Strona, której szukasz, nie istnieje albo została skoszona.</p>
  <a class="btn" href="/">wróć na stronę główną</a>
</div>
<div class="footer"><a href="/">trawiasta.pl</a></div>
</body>
</html>
