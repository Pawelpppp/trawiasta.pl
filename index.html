<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trawiasta.pl – wkrótce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0a;
    --accent: #3dff7a;
    --accent2: #b8ff3d;
    --text: #e8f5e9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(61, 255, 122, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(184, 255, 61, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .container {
    text-align: center;
    z-index: 2;
    padding: 2rem;
    max-width: 700px;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .grass {
    width: 2.2rem;
    height: 2.2rem;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px rgba(61, 255, 122, 0.4));
  }
  .logo {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .subtitle {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 300;
    opacity: 0.85;
    margin-bottom: 2.5rem;
    letter-spacing: 0.05em;
  }
  .status {
    display: inline-block;
    background: rgba(61, 255, 122, 0.1);
    border: 1px solid rgba(61, 255, 122, 0.3);
    color: var(--accent);
    padding: 0.4rem 1rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0c0a;
    border: none;
    padding: 1rem 2.2rem;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px rgba(61, 255, 122, 0.3);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(61, 255, 122, 0.5);
  }
  button:active { transform: translateY(0); }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.4;
    z-index: 2;
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="container">
  <div class="logo-wrap">
    <svg class="grass" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 58V28" stroke="#3dff7a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M32 42C26 36 20 28 18 16" stroke="#3dff7a" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 42C38 36 44 28 46 16" stroke="#b8ff3d" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 36C28 32 24 26 22 18" stroke="#7dffb3" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 36C36 32 40 26 42 18" stroke="#d4ff4a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 48C29 44 25 40 22 34" stroke="#3dff7a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M32 48C35 44 39 40 42 34" stroke="#b8ff3d" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="logo">trawiasta.pl</div>
  </div>
  <div class="subtitle">strona w budowie</div>
  <div class="status">wkrótce coś fajnego</div>
  <button id="launch">odpal fajerwerki</button>
</div>

<div class="footer">trawiasta.pl</div>

<script>
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 12;
    this.vy = (Math.random() - 0.5) * 12 - 2;
    this.life = 100 + Math.random() * 50;
    this.maxLife = this.life;
    this.size = 2 + Math.random() * 3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.vx *= 0.98;
    this.life--;
  }
  draw() {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function createFirework(x, y) {
  const colors = ['#3dff7a', '#b8ff3d', '#ffffff', '#7dffb3', '#d4ff4a', '#aaffaa', '#ffff66', '#99ff99'];
  const count = 110 + Math.floor(Math.random() * 70);
  for (let i = 0; i < count; i++) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    particles.push(new Particle(x, y, color));
  }
}

function animate() {
  ctx.fillStyle = 'rgba(10, 12, 10, 0.12)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  animationId = requestAnimationFrame(animate);
}

document.getElementById('launch').addEventListener('click', () => {
  for (let i = 0; i < 7; i++) {
    setTimeout(() => {
      const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
      const y = Math.random() * canvas.height * 0.55 + canvas.height * 0.05;
      createFirework(x, y);
      setTimeout(() => createFirework(x + (Math.random()-0.5)*90, y + 30), 60);
      setTimeout(() => createFirework(x + (Math.random()-0.5)*150, y - 35), 140);
    }, i * 160);
  }
});

animate();
</script>
</body>
</html>
