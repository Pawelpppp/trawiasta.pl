<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie | trawiasta.pl</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0c0a; --accent: #3dff7a; --accent2: #b8ff3d; --text: #e8f5e9; --err: #ff6b6b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem 1rem; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(61, 255, 122, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(184, 255, 61, 0.06) 0%, transparent 50%);
  }
  main { width: 100%; max-width: 420px; z-index: 2; text-align: center; }
  .logo-wrap { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; text-decoration: none; }
  .grass { width: 2.2rem; height: 2.2rem; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(61, 255, 122, 0.4)); }
  .brand, h1 {
    font-weight: 800; letter-spacing: -0.04em;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .brand { font-size: 1.8rem; }
  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(61, 255, 122, 0.18);
    border-radius: 1.5rem;
    padding: clamp(1.5rem, 6vw, 2.5rem);
    box-shadow: 0 0 60px rgba(61, 255, 122, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-align: left;
  }
  .card.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); }
  }
  @media (prefers-reduced-motion: reduce) { .card.shake { animation: none; } }
  h1 { font-size: clamp(1.9rem, 7vw, 2.4rem); line-height: 1.1; margin-bottom: 0.35rem; }
  .lead { font-weight: 300; opacity: 0.75; margin-bottom: 1.6rem; }
  .field { margin-bottom: 1.1rem; }
  label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.45rem; opacity: 0.9; }
  .input-wrap { position: relative; }
  input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--text);
    background: rgba(10, 12, 10, 0.7);
    border: 1px solid rgba(61, 255, 122, 0.25); border-radius: 0.9rem;
    padding: 0.85rem 1rem; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: rgba(232, 245, 233, 0.35); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 255, 122, 0.18); }
  input[aria-invalid="true"] { border-color: rgba(255, 107, 107, 0.6); }
  #password { padding-right: 3.2rem; }
  .toggle {
    position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%);
    width: 2.6rem; height: 2.6rem; border: none; border-radius: 0.7rem;
    background: transparent; color: var(--accent); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .toggle:hover, .toggle:focus-visible { background: rgba(61, 255, 122, 0.1); outline: none; }
  .toggle svg { width: 1.3rem; height: 1.3rem; }
  .error {
    min-height: 1.4rem; color: var(--err); font-size: 0.95rem; font-weight: 500;
    margin: 0.2rem 0 0.9rem;
  }
  .submit {
    width: 100%; font: inherit; font-size: 1.05rem; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0c0a;
    border: none; padding: 1rem 1.5rem; border-radius: 999px; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 30px rgba(61, 255, 122, 0.3);
  }
  .submit:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(61, 255, 122, 0.5); }
  .submit:active { transform: translateY(0); }
  .submit:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .back {
    display: inline-block; margin-top: 1.5rem; color: var(--accent); text-decoration: none;
    font-size: 0.95rem; opacity: 0.85;
  }
  .back:hover, .back:focus-visible { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <a class="logo-wrap" href="/" aria-label="trawiasta.pl – strona główna">
    <svg class="grass" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 58V28" stroke="#3dff7a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M32 42C26 36 20 28 18 16" stroke="#3dff7a" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 42C38 36 44 28 46 16" stroke="#b8ff3d" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 36C28 32 24 26 22 18" stroke="#7dffb3" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 36C36 32 40 26 42 18" stroke="#d4ff4a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 48C29 44 25 40 22 34" stroke="#3dff7a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M32 48C35 44 39 40 42 34" stroke="#b8ff3d" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="brand">trawiasta.pl</span>
  </a>

  <form class="card" id="login-form" novalidate>
    <h1>Logowanie</h1>
    <p class="lead">Zaloguj się, aby kontynuować.</p>

    <div class="field">
      <label for="login">Login</label>
      <input id="login" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Twój login" aria-describedby="error">
    </div>

    <div class="field">
      <label for="password">Hasło</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Twoje hasło" aria-describedby="error">
        <button type="button" class="toggle" id="toggle" aria-label="Pokaż hasło" aria-controls="password" aria-pressed="false">
          <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="error" id="error" role="alert" aria-live="assertive"></div>

    <button type="submit" class="submit">Zaloguj się</button>
  </form>

  <a class="back" href="/">← wróć na stronę główną</a>
</main>

<script>
// UWAGA: tymczasowe logowanie po stronie przeglądarki – to NIE jest prawdziwe zabezpieczenie.
(function () {
  var form = document.getElementById('login-form');
  var login = document.getElementById('login');
  var pass = document.getElementById('password');
  var error = document.getElementById('error');
  var toggle = document.getElementById('toggle');
  var eye = document.getElementById('eye');
  var EYE = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';

  toggle.addEventListener('click', function () {
    var show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Ukryj hasło' : 'Pokaż hasło');
    eye.innerHTML = show ? EYE_OFF : EYE;
    pass.focus();
  });

  function clearError() {
    error.textContent = '';
    login.removeAttribute('aria-invalid');
    pass.removeAttribute('aria-invalid');
  }
  login.addEventListener('input', clearError);
  pass.addEventListener('input', clearError);

  // dokąd wrócić po zalogowaniu (?next=/licznik/) – tylko ścieżki w obrębie tej strony
  function safeNext() {
    try {
      var n = new URLSearchParams(window.location.search).get('next');
      if (n && /^\/(?!\/)[^\\\s]*$/.test(n)) return n;
    } catch (err) {}
    return '/';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (login.value.trim() === 'admin' && pass.value === 'admin') {
      try { sessionStorage.setItem('trawiasta_zalogowany', '1'); } catch (err) {}
      window.location.href = safeNext();
      return;
    }
    error.textContent = 'Nieprawidłowy login lub hasło.';
    login.setAttribute('aria-invalid', 'true');
    pass.setAttribute('aria-invalid', 'true');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    pass.value = '';
    pass.focus();
  });
  form.addEventListener('animationend', function () { form.classList.remove('shake'); });
})();
</script>
</body>
</html>
